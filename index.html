<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Life Calender</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main>
            <div id="configuration">
                <div class="container">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="male" selected>male</option>
                        <option value="female">female</option>
                    </select>
                </div>

                <div class="container">
                    <label for="birthDate">Date of birth</label>
                    <input
                        type="date"
                        name="birthDate"
                        id="birthDate"
                        value="2000-01-01"
                    />
                </div>

                <div class="container">
                    <label for="view">View</label>
                    <select id="view">
                        <option value="week">week</option>
                        <option value="month" selected>month</option>
                        <option value="year">year</option>
                    </select>
                </div>
            </div>

            <p id="age"></p>
            <div id="calendar" onclick="calculateUserAge()"></div>
        </main>
        <footer>
            The people who did great things had the same 24 hours. The clock is
            running regardless. The only variable is what you do with the
            remaining
        </footer>
        <script src="script.js" />
    </body>
</html>
